services:
  # Servidor de juego: Node + Fastify + ws, estado de la ronda en memoria.
  - type: web
    name: subasta-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile && pnpm --filter @subasta/shared build && pnpm --filter @subasta/server build
    startCommand: pnpm --filter @subasta/server start
    healthCheckPath: /health
    envVars:
      - key: HOST_TOKEN
        sync: false
      - key: NODE_VERSION
        value: 20.18.0

  # Web estática: React + Vite, las tres rutas /screen /play /host.
  - type: web
    name: subasta-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile && pnpm --filter @subasta/shared build && pnpm --filter @subasta/web build
    staticPublishPath: apps/web/dist
    envVars:
      # Ajusta este valor si Render asigna un subdominio distinto a subasta-server
      # (revísalo en el dashboard de Render después del primer deploy).
      - key: VITE_WS_URL
        value: wss://subasta-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
